<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Cpath d='M3 11l3-4 3 2 4-5' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<title>Apartment dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.04);
    --up: #006300; --down: #d03b3b; --warn: #fab219;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
      --up: #0ca30c; --down: #e66767; --warn: #fab219;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 56px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0; }
  .muted { color: var(--muted); }
  header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; position: sticky; top: 8px; z-index: 5; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 2px; background: var(--page); }
  .seg button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
  .seg button:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  select { font: inherit; font-size: 13px; color: var(--ink); background: var(--page); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; }
  .fxline { font-size: 12.5px; color: var(--ink-2); margin: 0 2px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: space-between; }
  .banner { background: var(--surface); border: 1px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13.5px;
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .kpi .label { font-size: 12.5px; color: var(--ink-2); }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0 4px; line-height: 1.15; }
  .kpi .note { font-size: 12px; color: var(--muted); }
  .delta { font-size: 12px; color: var(--ink-2); display: block; }
  .delta b { font-weight: 600; }
  .delta .up { color: var(--up); } .delta .down { color: var(--down); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .chart { position: relative; height: 280px; }
  .chart.small { height: 190px; }
  .chartfoot { display: flex; justify-content: flex-end; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
  .chartfoot label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .chartfoot input { accent-color: var(--s1); margin: 0; }
  .pie { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 8px 20px; align-items: center; }
  .pie .chart { height: 230px; grid-column: 1; grid-row: 1; }
  .pie .chartfoot { grid-column: 1 / -1; grid-row: 2; }
  .pielegend { grid-column: 2; grid-row: 1; list-style: none; margin: 0; padding: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
  .pielegend li { display: grid; grid-template-columns: 12px 1fr auto 52px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  .pielegend li:last-child { border-bottom: 0; }
  .pielegend li.main, .pielegend li.sum { color: var(--ink); font-weight: 650; }
  .pielegend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
  .pielegend .v { color: var(--ink); } .pielegend .p { text-align: end; color: var(--muted); font-weight: 400; }
  .section { margin: 26px 2px 10px; }
  .section h2 { font-size: 18px; }
  .partners { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .partners.one { grid-template-columns: 1fr; }
  .partner .stats { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 12px 24px; margin-top: 10px; align-items: end; }
  .partner .stats .k { font-size: 12.5px; color: var(--ink-2); }
  .partner .stats .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .partner .stats .v.big { font-size: 26px; letter-spacing: -.02em; }
  .partner .name { font-weight: 650; font-size: 15px; }
  .partner .value { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin: 4px 0; }
  .partner dl { margin: 6px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; color: var(--ink-2); }
  .partner dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: end; white-space: nowrap; border-bottom: 1px solid var(--grid); }
  th { font-weight: 600; color: var(--ink-2); font-size: 12px; vertical-align: bottom; }
  th:first-child, td:first-child { text-align: start; position: sticky; inset-inline-start: 0; background: var(--surface); }
  td.text, th.text { text-align: start; white-space: normal; }
  tbody tr.sel td { background: var(--wash); }
  tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--s1); }
  [dir="rtl"] tbody tr.sel td:first-child { box-shadow: inset -3px 0 0 var(--s1); }
  tbody tr[data-month] { cursor: pointer; }
  tfoot td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--axis); }
  .btn { all: unset; cursor: pointer; font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--page); color: var(--ink); }
  .btn:hover { background: var(--wash); }
  a.btn { display: inline-block; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks > li { padding: 9px 0; border-bottom: 1px solid var(--grid); display: grid; grid-template-columns: 22px 92px 1fr; gap: 6px; font-size: 13.5px; }
  .checks > li:last-child { border-bottom: 0; }
  .checks .ok { color: var(--up); font-weight: 700; } .checks .flag { color: var(--down); font-weight: 700; }
  .checks ul { margin: 0; padding-inline-start: 18px; }
  .drop { display: block; border: 1.5px dashed var(--axis); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--ink-2); font-size: 13.5px; cursor: pointer; }
  .drop.over { background: var(--wash); border-color: var(--s1); }
  .drop .err { color: var(--down); margin-top: 8px; }
  ol.steps { margin: 6px 0 12px; padding-inline-start: 20px; font-size: 13.5px; color: var(--ink-2); }
  ol.steps li { margin: 3px 0; }
  code { font-size: 12.5px; background: var(--wash); padding: 1px 5px; border-radius: 5px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
  #fatal { padding: 40px 16px; text-align: center; color: var(--ink-2); }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid3, .partners { grid-template-columns: 1fr; }
    .kpi .value { font-size: 22px; }
    .partner .stats { grid-template-columns: 1fr 1fr; }
    .pie { grid-template-columns: 1fr; } .pielegend { grid-column: 1; grid-row: 2; } .pie .chartfoot { grid-row: 3; }
    .controls { position: static; }
    .checks > li { grid-template-columns: 22px 1fr; } .checks > li > div:last-child { grid-column: 2; }
  }
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="toggles">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button data-v="en">English</button><button data-v="he">עברית</button><button data-v="el">Ελληνικά</button>
      </div>
      <div class="seg" id="curSeg" role="group" aria-label="Currency">
        <button data-v="EUR">€ EUR</button><button data-v="ILS">₪ ILS</button>
      </div>
    </div>
  </header>

  <div id="previewBanner" class="banner" hidden></div>

  <div class="controls">
    <div class="seg" id="scopeSeg" role="group"></div>
    <select id="monthSel" aria-label="Month"></select>
    <select id="platformSel" aria-label="Platform"></select>
  </div>
  <div class="fxline"><span id="fxText"></span><span id="updated"></span></div>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <div class="card">
      <div class="cardhead"><div><h2 data-t="wfTitle"></h2><p class="sub" id="wfSub"></p></div></div>
      <div class="pie"><div class="chart" id="wfBox"><canvas id="wfChart"></canvas></div><ul class="pielegend" id="wfLegend"></ul></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h2 data-t="stackTitle"></h2><p class="sub" data-t="stackSub"></p></div>
        <div class="seg" id="stackSeg" role="group"></div></div>
      <div class="chart" style="height:320px"><canvas id="stackChart"></canvas></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="cardhead"><div><h2 data-t="trendTitle"></h2><p class="sub" data-t="trendSub"></p></div></div>
    <div class="chart"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="grid3">
    <div class="card"><div class="cardhead"><div><h2 data-t="occTitle"></h2><p class="sub" data-t="occSub"></p></div></div><div class="chart small"><canvas id="occChart"></canvas></div></div>
    <div class="card"><div class="cardhead"><div><h2 data-t="adrTitle"></h2><p class="sub" data-t="adrSub"></p></div></div><div class="chart small"><canvas id="adrChart"></canvas></div></div>
    <div class="card"><div class="cardhead"><div><h2 data-t="shareTitle"></h2><p class="sub" data-t="shareSub"></p></div></div><div class="chart small"><canvas id="shareChart"></canvas></div></div>
  </div>

  <div class="card" id="platformCard" style="margin-bottom:12px">
    <div class="cardhead"><div><h2 data-t="platTitle"></h2><p class="sub" id="platSub"></p></div></div>
    <div class="chart small" id="platBox"><canvas id="platChart"></canvas></div>
  </div>

  <div class="section"><h2 data-t="partnersTitle"></h2><p class="sub" id="partnersSub"></p></div>
  <section class="partners" id="partners"></section>
  <div class="grid2">
    <div class="card">
      <div class="cardhead"><div><h2 data-t="cumTitle"></h2><p class="sub" data-t="cumSub"></p></div></div>
      <div class="chart"><canvas id="cumChart"></canvas></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h2 data-t="partnerTableTitle"></h2><p class="sub" data-t="partnerTableSub"></p></div></div>
      <div class="tablewrap"><table id="partnerTable"></table></div>
    </div>
  </div>

  <div class="section"><h2 data-t="statementTitle"></h2><p class="sub" data-t="statementSub"></p></div>
  <div class="card" style="margin-bottom:12px">
    <div class="cardhead"><div></div><button class="btn" id="csvBtn"></button></div>
    <div class="tablewrap"><table id="statementTable"></table></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="cardhead"><div><h2 data-t="faultsTitle"></h2><p class="sub" data-t="faultsSub"></p></div></div>
      <div class="tablewrap"><table id="faultsTable"></table></div>
      <div class="empty" id="faultsEmpty" hidden></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h2 data-t="checkTitle"></h2><p class="sub" id="checkSub"></p></div></div>
      <ul class="checks" id="checks"></ul>
    </div>
  </div>

  <div class="section"><h2 data-t="uploadTitle"></h2><p class="sub" data-t="uploadSub"></p></div>
  <div class="grid2">
    <div class="card">
      <h2 data-t="publishTitle"></h2>
      <ol class="steps" id="publishSteps"></ol>
      <a class="btn" id="uploadLink" target="_blank" rel="noopener" hidden></a>
    </div>
    <div class="card">
      <h2 data-t="previewTitle"></h2>
      <p class="sub" data-t="previewSub" style="margin-bottom:10px"></p>
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="file" accept=".xlsx" hidden>
        <div id="dropText"></div>
        <div class="err" id="dropErr" hidden></div>
      </label>
    </div>
  </div>

  <footer id="footer"></footer>
</div>
<div id="fatal" hidden></div>

<script src="vendor/chart.umd.js"></script>
<script src="js/parser.js"></script>

function renderChecks() {
  var latest = MONTHS[MONTHS.length - 1].rates || {};
  $('checkSub').textContent = t('checkSub', { r: t('ratesLine', { e: eur(latest.envFeePerNight), v: pct(latest.vat, 0), c: pct(latest.cityTax, 1), m: pct(latest.mgmtFee, 0), k: eur(latest.cleaningPerOrder) }) });
  var usual = {}; // typical commission share per platform, where the sheet states no rate
  Object.keys(platformKeys()).forEach(function (p) { usual[p] = median(MONTHS.filter(function (m) { return (m.platforms[p] || {}).gross > 0; }).map(function (m) { return m.platforms[p].commission / m.platforms[p].gross; })); });
  $('checks').innerHTML = MONTHS.slice().reverse().map(function (m) {
    var items = (m.checks || []).map(function (c) { return t('checkLine', { f: (c.field === 'total' ? t('checkTotal') : t(c.field)) + (c.platform !== 'all' ? ' (' + platLabel(c.platform) + ')' : ''), s: eur(c.stated), e: eur(c.expected) }); });
    Object.keys(m.platforms).forEach(function (p) { var x = m.platforms[p]; if (!(x.gross > 0) || isNaN(usual[p])) return;
      var r = x.commission / x.gross, diff = x.commission - usual[p] * x.gross;
      if (Math.abs(r - usual[p]) > 0.003) items.push(t(diff > 0 ? 'checkCommission' : 'checkCommissionLess', { p: platLabel(p), a: pct(r, 2), b: pct(usual[p], 2), d: eur(Math.abs(diff)) })); });
    var notes = []; if (m.manual) notes.push(t('manualEntry'));
    var ok = !items.length;
    return '<li><span class="' + (ok ? 'ok' : 'flag') + '">' + (ok ? '✓' : '!') + '</span><b>' + esc(mLabel(m.month)) + '</b><div>' +
      (ok ? esc(t('checkOk')) : '<ul>' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>') +
      notes.map(function (n) { return '<div class="muted" style="font-size:12.5px" dir="auto">' + esc(n) + '</div>'; }).join('') + '</div></li>';
  }).join('');
}

/* ------------------------------------------------------------ chrome etc */
function seg(id, options, current, onPick) {
  var el = $(id);
  if (options) el.innerHTML = options.map(function (o) { return '<button data-v="' + o[0] + '">' + esc(o[1]) + '</button>'; }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.v === current));
    b.onclick = function () { onPick(b.dataset.v); };
  });
}
function renderChrome() {
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'he' ? 'rtl' : 'ltr';
  var name = DATA.config.propertyName[S.lang] || DATA.config.propertyName.en;
  document.title = name; $('title').textContent = name; $('subtitle').textContent = t('subtitle');
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t(el.dataset.t); });
  seg('langSeg', null, S.lang, function (v) { S.lang = v; store.set('lang', v); render(); });
  seg('curSeg', null, S.cur, function (v) { S.cur = v; store.set('cur', v); render(); });
  seg('scopeSeg', [['month', t('scopeMonth')], ['ytd', t('scopeYtd')], ['all', t('scopeAll')]], S.scope, function (v) { S.scope = v; render(); });
  seg('stackSeg', [['abs', t('amounts')], ['pct', t('percent')]], S.stack, function (v) { S.stack = v; render(); });
  var ms = $('monthSel'); ms.innerHTML = MONTHS.slice().reverse().map(function (m) { return '<option value="' + m.month + '">' + esc(mLabel(m.month, 'long')) + (m.preview ? ' *' : '') + '</option>'; }).join('');
  ms.value = S.month; ms.disabled = S.scope === 'all'; ms.onchange = function () { S.month = ms.value; render(); };
  var names = platformKeys(), ps = $('platformSel');
  ps.innerHTML = '<option value="all">' + esc(t('allPlatforms')) + '</option>' + Object.keys(names).map(function (p) { return '<option value="' + p + '">' + esc(platLabel(p)) + '</option>'; }).join('');
  ps.value = S.platform; ps.onchange = function () { S.platform = ps.value; render(); };

  var fxText;
  if (S.scope === 'month') { var fx = fxOf(find(S.month));
    fxText = t('fxMonth', { rate: num(fx.rate, 4), src: fx.source || 'ECB', date: fx.date ? dLabel(fx.date) : '–' }) + (fx.provisional ? ' (' + t('fxProvisional') + ')' : '');
  } else fxText = t('fxMulti');
  if (S.cur === 'ILS') fxText += ' ' + t('fxNote');
  $('fxText').textContent = fxText;
  $('updated').textContent = t('updated') + ': ' + new Intl.DateTimeFormat(locale(), { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(DATA.generatedAt));

  $('publishSteps').innerHTML = t('steps').map(function (s) { return '<li>' + s + '</li>'; }).join('');
  var repo = DATA.config.repoUrl || '', host = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (!repo && host) { var seg1 = location.pathname.split('/').filter(Boolean)[0]; repo = 'https://github.com/' + host[1] + '/' + (seg1 || host[0]); }
  var link = $('uploadLink'); link.hidden = !repo; if (repo) { link.href = repo.replace(/\/$/, '') + '/upload/main/reports'; link.textContent = t('openUpload') + ' ↗'; }
  $('dropText').textContent = t('dropText'); $('footer').textContent = t('footer');
  var pb = $('previewBanner'); pb.hidden = !PREVIEW;
  if (PREVIEW) { pb.innerHTML = '<span>' + esc(t('previewBanner', { m: mLabel(PREVIEW.month, 'long'), f: PREVIEW.source })) + '</span><button class="btn" id="discardBtn">' + esc(t('discard')) + '</button>';
    $('discardBtn').onclick = function () { PREVIEW = null; rebuildMonths(); render(); }; }
}
function renderLabelToggles() {
  Array.prototype.forEach.call(document.querySelectorAll('.chart canvas'), function (cv) {
    var box = cv.parentNode, foot = box.nextElementSibling;
    if (!foot || !foot.classList.contains('chartfoot')) { foot = document.createElement('div'); foot.className = 'chartfoot'; box.parentNode.insertBefore(foot, box.nextSibling); }
    foot.hidden = box.hidden;
    foot.innerHTML = '<label><input type="checkbox"' + (lab(cv.id) ? ' checked' : '') + '> ' + esc(t('dataLabels')) + '</label>';
    foot.querySelector('input').onchange = function () { S.labels[cv.id] = this.checked; store.set('labels', JSON.stringify(S.labels)); render(); };
  });
}
function render() {
  if (!find(S.month)) S.month = MONTHS[MONTHS.length - 1].month;
  renderChrome(); renderKpis(); renderWaterfall(); renderStack(); renderTrend(); renderPlatforms(); renderPartners(); renderStatement(); renderFaults(); renderChecks(); renderLabelToggles();
}
function rebuildMonths() {
  MONTHS = PUBLISHED.slice();
  if (PREVIEW) { MONTHS = MONTHS.filter(function (m) { return m.month !== PREVIEW.month; }); MONTHS.push(PREVIEW); }
  MONTHS.sort(function (a, b) { return a.month < b.month ? -1 : 1; });
}

/* -------------------------------------------------------- local preview */
function loadScript(src) { return new Promise(function (ok, bad) { if (window.XLSX) return ok(); var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
function previewFile(file) {
  var err = $('dropErr'); err.hidden = true; $('dropText').textContent = t('reading');
  loadScript('vendor/xlsx.full.min.js').then(function () { return file.arrayBuffer(); }).then(function (buf) {
    var opts = Object.assign({ type: 'array' }, ReportParser.READ_OPTIONS);
    var m = ReportParser.parseWorkbook(XLSX, XLSX.read(new Uint8Array(buf), opts), file.name);
    m.preview = true; m.fx = null; PREVIEW = m; rebuildMonths(); S.month = m.month; S.scope = 'month'; render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }).catch(function (e) { $('dropText').textContent = t('dropText'); err.hidden = false; err.textContent = e && e.message ? e.message : String(e); });
}
function wireUpload() {
  var drop = $('drop'), file = $('file');
  file.onchange = function () { if (file.files[0]) previewFile(file.files[0]); file.value = ''; };
  drop.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
  ['dragenter', 'dragover'].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) previewFile(f); });
  $('csvBtn').onclick = exportCsv;
  document.addEventListener('click', function (e) { var tr = e.target.closest && e.target.closest('tr[data-month]'); if (tr) { S.month = tr.dataset.month; if (S.scope === 'all') S.scope = 'month'; render(); } });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (DATA) render(); });
}

/* ------------------------------------------------------------------ boot */
fetch('data.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
  if (!d.months || !d.months.length) throw new Error('empty');
  DATA = d; PUBLISHED = d.months; rebuildMonths(); S.month = MONTHS[MONTHS.length - 1].month;
  $('app').hidden = false; wireUpload(); render();
}).catch(function () { var f = $('fatal'); f.hidden = false; f.textContent = T[S.lang].loadError; });
})();
</script>
</body>
</html>
